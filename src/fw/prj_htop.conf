# Htop firmware Kconfig overrides.
# Applied on top of prj.conf when building with --variant=htop.
# Everything that is not needed to draw the htop watchface is off.

CONFIG_SHELL_HTOP=y

CONFIG_BT_FW_STUB=y
CONFIG_SERVICE_BLUETOOTH=n
CONFIG_SERVICE_COMM_SESSION=n
CONFIG_SERVICE_DEBOUNCED_CONNECTION_SERVICE=n
CONFIG_SERVICE_FIRMWARE_UPDATE=n
CONFIG_SERVICE_GET_BYTES=n
CONFIG_SERVICE_PHONE_PP=n
CONFIG_SERVICE_PING=n
CONFIG_SERVICE_POLL_REMOTE=n
CONFIG_SERVICE_PRF_UPDATE=n
CONFIG_SERVICE_PUT_BYTES=n
CONFIG_SERVICE_REGISTRY_ENDPOINT=n
CONFIG_SERVICE_SHARED_PRF_STORAGE=n

# Nothing else runs, so no scheduling or feedback either.
# Fixed backlight, fixed orientation.
CONFIG_DYNAMIC_BACKLIGHT=n
CONFIG_ORIENTATION_MANAGER=n
# No heart rate sensor.
CONFIG_HRM_HRV=n
CONFIG_HRM_GH3X2X=n
CONFIG_HRM_STUB=n
CONFIG_HRM=n
CONFIG_SERVICE_ANALYTICS=n
CONFIG_SERVICE_BOOT_SPLASH=n
CONFIG_SERVICE_CRON=n
CONFIG_SERVICE_VIBE_PATTERN=n

# The watchface is the only interface, so nothing is ever typed at the
# debug UART. Its receiver keeps the SoC out of its deepest low power
# modes, so drop it and keep only the outgoing log stream.
CONFIG_DBGSERIAL_RX=n
CONFIG_PROMPT=n

# No app installs, so no SDK-facing machinery.
CONFIG_MODDABLE_XS=n
