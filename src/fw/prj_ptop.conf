# Ptop firmware Kconfig overrides.
# Applied on top of prj.conf when building with --variant=ptop.
# Everything that is not needed to draw the ptop watchface is off.

CONFIG_SHELL_PTOP=y

# Bluetooth stays on: it is the only way to set the clock, and it keeps
# the watch updatable without going through recovery. Transferring a
# firmware image needs somewhere to put it, so the filesystem comes too.
CONFIG_SERVICE_FILESYSTEM=y
# Pairing keys have to survive a reboot, so the settings store comes too.
CONFIG_SERVICE_SETTINGS=y
# The phone is only there to set the clock and push firmware. No music
# remote, no notification mirroring.
CONFIG_BT_AMS_CLIENT=n
CONFIG_BT_ANCS_CLIENT=n

# Without it nothing ever turns the radio off: the watch advertises for
# ever, even sitting on a table. It drops to the stationary run level
# after half an hour without motion, which cuts Bluetooth, the backlight
# and the vibration motor.
CONFIG_SERVICE_STATIONARY=y

# Nothing else runs, so no scheduling or feedback either.
# Fixed backlight, fixed orientation.
CONFIG_DYNAMIC_BACKLIGHT=n
CONFIG_ORIENTATION_MANAGER=n
# No heart rate sensor.
CONFIG_HRM_HRV=n
CONFIG_HRM_GH3X2X=n
CONFIG_HRM_STUB=n
CONFIG_HRM=n
CONFIG_SERVICE_ANALYTICS=n
CONFIG_SERVICE_BOOT_SPLASH=n
CONFIG_SERVICE_CRON=n
CONFIG_SERVICE_VIBE_PATTERN=n

# The watchface is the only interface, so nothing is ever typed at the
# debug UART. Its receiver keeps the SoC out of its deepest low power
# modes, so drop it and keep only the outgoing log stream.
CONFIG_DBGSERIAL_RX=n
CONFIG_PROMPT=n

# No app installs, so no SDK-facing machinery.
CONFIG_MODDABLE_XS=n

# The clock endpoint asks the database to turn the phone's timezone name
# into an offset, so without it the phone can never set the time.
CONFIG_SERVICE_TIMEZONE_DATABASE=y
